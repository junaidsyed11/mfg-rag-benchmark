[project]
name = "mfg-rag-benchmark"
version = "0.1.0"
description = "Hybrid search + rerank RAG system for manufacturing and supply chain documents"
requires-python = ">=3.11"

dependencies = [
    # Embedding backends
    "cohere>=5.0",                    # Cohere Embed v4 + Rerank v4
    "sentence-transformers>=3.0",     # EmbeddingGemma via HuggingFace

    # Retrieval
    "rank-bm25>=0.2.2",               # BM25 sparse index
    "chromadb>=0.5",                  # Vector store (dense index)

    # Generation
    "anthropic>=0.30",                # Claude API for generation step

    # Data + config
    "python-dotenv>=1.0",             # Load .env API keys
    "pyyaml>=6.0",                    # YAML config files
    "pandas>=2.0",                    # Data loading and normalization
    "numpy>=1.26",                    # Numeric ops

    # Testing
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",       # Linter + formatter
    "ipykernel>=6.0",  # Notebook support
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
